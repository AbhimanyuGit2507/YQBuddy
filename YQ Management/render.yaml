services:
  - type: web
    name: qmova-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "20.x"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qmova-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: qmova-db
    databaseName: yq_queue
    user: qmova
    plan: free
